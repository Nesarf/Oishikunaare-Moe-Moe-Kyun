# oishikunaare-moe-moe-kyun bundle patch: inserts its row into the web plugin roster.
#
# The package name is lowercase because npm requires it for a new package (the project, the repository
# and the local checkout all keep the capitalized display name: Oishikunaare-Moe-Moe-Kyun).
# Install with: dsh plugin --profile web add github:Nesarf/Oishikunaare-Moe-Moe-Kyun
#          or: dsh plugin --profile web add oishikunaare-moe-moe-kyun
- insert:
    - id: oishikunaare-moe-moe-kyun
      name: oishikunaare-moe-moe-kyun
